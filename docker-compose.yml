services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/static
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
    command: bash -c "uv pip install --system -r /app/backend/requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
